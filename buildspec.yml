version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - pip install semgrep checkov
      - curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      - curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
  pre_build:
    commands:
      - echo "== Secrets ==" && gitleaks detect --source . --no-git --redact --exit-code 1
      - echo "== SAST ==" && semgrep --config auto --error --exclude node_modules .
      - echo "== Deps ==" && trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --skip-dirs node_modules .
      - echo "== Dockerfile ==" && checkov -f Dockerfile --framework dockerfile --quiet
  build:
    commands:
      - npm ci --omit=dev

artifacts:
  files:
    - '**/*'
  exclude-paths:
    - .git/**/*